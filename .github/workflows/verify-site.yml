name: Verify and publish personal site

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Minify JavaScript
        run: |
          npm install -g uglify-js
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build site
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Inspect generated pages
        run: |
          echo "About page sections:"
          grep -o '<h2[^>]*>[^<]*</h2>' _site/index.html || true
          echo "Publication venues and years:"
          grep -o 'Published in <i>[^<]*</i>, [0-9]*' _site/publications/index.html || true
          echo "About page publication count:"
          grep -o '<li>' _site/index.html | wc -l
          echo "Contact email links:"
          grep -o 'mailto:[^"]*' _site/index.html | sort -u || true
          echo "Generated publication pages:"
          ls _site/publication
      - name: Publish site to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
      - name: Report Pages configuration
        run: |
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/spallaselvylt934482/LJT-Homepage/pages
